[package]
name = "logq"
description = "A web-server log file command line toolkit with SQL interface"
repository = "https://github.com/MnO2/logq"
version = "0.1.19"
license = "Apache-2.0 OR BSD-3-Clause"
authors = ["Paul Meng <me@paulme.ng>"]
readme = "README.md"
keywords = ["log", "sql", "query", "search"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.85"
exclude = ["/benches/**", "/data/**"]

[features]
bench-internals = []

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1.5"
thiserror = "2"
hashbrown = "0.17"
ordered-float = "5"
nom = "7.0"
prettytable-rs = "^0.10"
chrono = "0.4"
url = "2.2"
csv = "1.1"
lazy_static = "1.4.0"
serde_json = { version = "1", features = ["preserve_order"] }
tdigest = "0.2.3"
pdatastructs = "0.7"
linked-hash-map = "0.5"
anyhow = "1.0"
lru = "0.18"
memmap2 = "0.9"
rayon = "1.10"
smallvec = "1"
memchr = "2"
compact_str = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
glob = "0.3"

[dev-dependencies]
criterion = "0.7"
rand = "0.8"
tempfile = "3.2"
linked-hash-map = "0.5"

[[bench]]
name = "bench_parser"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "bench_execution"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "bench_datasource"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "bench_udf"
harness = false

[[bench]]
name = "bench_sort"
harness = false
required-features = ["bench-internals"]
